server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # The privacy notice says no access logs are kept. This is what makes it true.
    access_log off;

    gzip on;
    gzip_types text/css text/plain application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    # www has no content of its own.
    if ($host = "www.pilanda.systems") {
        return 301 https://pilanda.systems$request_uri;
    }

    # The form moved here, and the old address is in links already sent out.
    location = /projektplan {
        return 301 /anfrage;
    }

    # Only exists right after sending. As in the app, a direct visit leads to the form.
    location = /danke {
        return 302 /anfrage;
    }

    location = / {
        try_files /index.html =404;
    }

    # Pages have no extension in their links. A trailing slash leads to the same page.
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html =404;
    }

    # File names carry a content hash. "expires" keeps the headers above,
    # add_header here would drop them.
    location /assets/ {
        expires 1y;
    }
}
