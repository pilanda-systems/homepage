name: Pages

# The site is static HTML with no build step. The run uploads the state of
# `main` as an artifact and publishes it - no npm, no generator, nothing that
# could come between the source and the result.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A running one is not cancelled, so a half
# published site never stays up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        # A dead link to a subpage or to the signet only shows up in the
        # customer's browser. Here it shows up first.
        run: |
          missing=0
          for file in *.html; do
            while read -r target; do
              case "$target" in
                http*|mailto:*|tel:*|\#*|"") continue ;;
              esac
              target="${target%%#*}"
              [ -z "$target" ] && continue
              if [ ! -f "$target" ]; then
                echo "::error file=$file::links to $target - which does not exist"
                missing=1
              fi
            done < <(grep -oE '(href|src)="[^"]+"' "$file" | cut -d'"' -f2)
          done
          exit $missing

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
