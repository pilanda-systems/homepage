name: Pages

# Publishes site/ as it stands on `main`. The files there come from the
# nightly sync (sync-web.yml); this run only checks and uploads them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A running one is not cancelled, so a half
# published site never stays up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        # A dead link to a subpage or to an asset only shows up in the
        # customer's browser. Here it shows up first. Links are root-relative
        # and pages have no extension, as GitHub Pages resolves them.
        working-directory: site
        run: |
          missing=0
          for file in *.html; do
            while read -r target; do
              case "$target" in
                http*|mailto:*|tel:*|data:*|\#*|"") continue ;;
              esac
              target="${target%%#*}"
              target="${target%%\?*}"
              target="${target#/}"
              [ -z "$target" ] && continue
              if [ ! -f "$target" ] && [ ! -f "$target.html" ]; then
                echo "::error file=$file::links to $target - which does not exist"
                missing=1
              fi
            done < <(grep -aoE '(href|src)="[^"]+"' "$file" | cut -d'"' -f2)
          done
          exit $missing

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
